<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Faculty Monitoring Console</title>
  <link rel="icon" type="image/png" href="NCC.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(167, 139, 250, 0.6);
      outline: none;
    }
    .glass-input::placeholder {
      color: rgba(203, 213, 225, 0.6);
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased relative">

  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md p-4">
    <div class="glass w-full max-w-md rounded-2xl p-8 text-white">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 rounded-full bg-violet-500/20 mb-3 border border-violet-400/30">
          <svg class="w-8 h-8 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight">Admin Access Only</h2>
        <p class="text-xs text-slate-300 mt-1">Authenticate to open the faculty audit console</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Admin Username</label>
          <input type="text" id="username" required placeholder="Enter admin username" class="glass-input w-full px-4 py-2.5 rounded-lg text-sm transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="glass-input w-full px-4 py-2.5 rounded-lg text-sm transition">
        </div>
        <p id="loginError" class="text-rose-400 text-xs hidden text-center font-medium">Invalid administrator credentials.</p>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-medium rounded-lg text-sm transition shadow-lg shadow-indigo-500/30 active:scale-[0.98]">
          Sign In to Admin Dashboard
        </button>
      </form>
    </div>
  </div>

  <div class="container mx-auto px-4 py-10 max-w-6xl">
    
    <header class="glass rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="p-2 bg-indigo-500/20 rounded-xl border border-indigo-400/30 shrink-0">
          <img src="NCC.png" alt="NCC Logo" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="text-xl font-bold">Administrator Monitoring Console</h1>
          <p class="text-xs text-slate-400">Institutional Faculty Class Verification & Audit</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchRemoteRecords()" class="px-3 py-2 glass text-xs font-medium text-emerald-300 hover:text-emerald-100 hover:bg-emerald-500/20 rounded-lg transition border border-emerald-500/20 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Refresh Live Data
        </button>
        <button onclick="handleLogout()" class="px-4 py-2 glass text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition border border-white/10">
          Log Out
        </button>
      </div>
    </header>

    <section class="glass rounded-2xl p-6 mb-8 border border-white/10">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-4">
        <h2 class="text-base font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          Filter Submissions
        </h2>
        <button onclick="resetFilters()" class="text-xs text-violet-300 hover:underline">Reset Search Filters</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Filter by Faculty Name</label>
          <input type="text" id="filterName" oninput="applyFilters()" placeholder="Search by instructor name..." class="glass-input w-full px-4 py-2 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Filter by Subject</label>
          <input type="text" id="filterSubject" oninput="applyFilters()" placeholder="Search by course or subject title..." class="glass-input w-full px-4 py-2 rounded-lg text-sm">
        </div>
      </div>
    </section>

    <section class="glass rounded-2xl p-6 border border-white/10">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold flex items-center gap-2">
          Faculty Submissions Feed
          <span class="flex h-2 w-2 relative" title="Auto-refresh active (3s)">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
        </h2>
        <span id="recordCount" class="text-xs bg-violet-500/20 text-violet-300 border border-violet-400/30 px-3 py-1 rounded-full">Syncing...</span>
      </div>

      <div id="submissionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[600px] overflow-y-auto pr-2">
        <p id="emptyState" class="col-span-full text-slate-400 text-sm italic text-center py-12">Fetching live submissions from Google Drive...</p>
      </div>
    </section>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXFZPbRxSxiafPt2vZsPZ509RnQ_8kvVMRrMZIzv8pIE4iOxYEQlQzllliTeYEBOfd/exec";

    // ADMIN CREDENTIALS
    const AUTHORIZED_ADMINS = {
      "FRA": "FRA2026"
    };

    let allFetchedRecords = [];
    let autoRefreshInterval = null;

    document.addEventListener("DOMContentLoaded", () => {
      fetchRemoteRecords();
      startAutoRefresh();
    });

    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      // Auto-refresh every 3 seconds (3000 ms)
      autoRefreshInterval = setInterval(fetchRemoteRecords, 3000);
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('loginError');

      if (AUTHORIZED_ADMINS[user] && AUTHORIZED_ADMINS[user] === pass) {
        document.getElementById('loginModal').classList.add('hidden');
        errorMsg.classList.add('hidden');
        document.getElementById('loginForm').reset();
        fetchRemoteRecords();
        startAutoRefresh();
      } else {
        errorMsg.classList.remove('hidden');
      }
    }

    function handleLogout() {
      document.getElementById('loginModal').classList.remove('hidden');
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    }

    async function fetchRemoteRecords() {
      const countBadge = document.getElementById('recordCount');
      
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.result === "success") {
          allFetchedRecords = data.records;
          applyFilters();
        }
      } catch (err) {
        const container = document.getElementById('submissionsContainer');
        container.innerHTML = `<p class="col-span-full text-rose-400 text-xs text-center py-8">Failed to sync records from Google Sheet. Check network connection or SCRIPT_URL configuration.</p>`;
        countBadge.textContent = "Sync error";
      }
    }

    function applyFilters() {
      const nameQuery = document.getElementById('filterName').value.toLowerCase().trim();
      const subjectQuery = document.getElementById('filterSubject').value.toLowerCase().trim();
      const container = document.getElementById('submissionsContainer');
      const countBadge = document.getElementById('recordCount');

      const filtered = allFetchedRecords.filter(record => {
        const matchesName = String(record.name || '').toLowerCase().includes(nameQuery);
        const matchesSubject = String(record.subject || '').toLowerCase().includes(subjectQuery);
        return matchesName && matchesSubject;
      });

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `<p id="emptyState" class="col-span-full text-slate-400 text-sm italic text-center py-12">No records found matching your current filter criteria.</p>`;
        countBadge.textContent = "0 entries";
        return;
      }

      filtered.forEach(record => {
        renderRecordCard(record);
      });

      countBadge.textContent = `${filtered.length} of ${allFetchedRecords.length} entries`;
    }

    function resetFilters() {
      document.getElementById('filterName').value = '';
      document.getElementById('filterSubject').value = '';
      applyFilters();
    }

    function renderRecordCard(record) {
      const container = document.getElementById('submissionsContainer');
      const card = document.createElement('div');
      card.className = "glass p-4 rounded-xl border border-white/10 flex flex-col justify-between gap-4";

      const formattedDate = record.date ? new Date(record.date).toLocaleDateString() : 'N/A';

      card.innerHTML = `
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 text-[10px] font-semibold uppercase rounded tracking-wider">Verified Record</span>
            <span class="text-[11px] text-slate-400">${formattedDate}</span>
          </div>
          <div>
            <h3 class="font-semibold text-base text-white">${record.subject}</h3>
            <p class="text-xs text-slate-300 mt-1">Faculty: <span class="text-violet-300 font-medium">${record.name}</span></p>
          </div>
        </div>
        <div class="pt-2 border-t border-white/10 flex justify-end">
          <a href="${record.imageSrc}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-violet-600/40 hover:bg-violet-600/60 border border-violet-400/30 text-xs rounded-lg text-violet-200 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            View Drive Screenshot
          </a>
        </div>
      `;

      container.appendChild(card);
    }
  </script>
</body>
</html>
